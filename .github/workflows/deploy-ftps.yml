name: Build and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 예약 발행을 위해 매일 한 번 다시 빌드합니다.
  # 정적 사이트라 빌드할 때만 "오늘"이 갱신되므로, 이 실행이 없으면
  # 앞날 날짜로 적어 둔 글이 그날이 되어도 공개되지 않습니다.
  # 21:30 UTC = 한국 시간 다음 날 06:30
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Deploy the built files by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTPS_SERVER }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTPS_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
